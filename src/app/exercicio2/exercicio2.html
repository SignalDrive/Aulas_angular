<h2>Controle de estoque</h2>

<div>
  <label for="nomeProduto">Nome</label>
  <input id="nomeProduto" type="text" [(ngModel)]="novoProduto.nome" placeholder="Nome do produto" />

  <label for="quantidadeProduto">Quantidade</label>
  <input id="quantidadeProduto" type="number" [(ngModel)]="novoProduto.quantidade" min="1" />

  <label for="precoProduto">Preço</label>
  <input id="precoProduto" type="number" [(ngModel)]="novoProduto.preco" min="0" step="0.01" />

  <button type="button" (click)="adicionarProduto()">Adicionar</button>
</div>

<table>
  <thead>
    <tr>
      <th>Produto</th>
      <th>Quantidade</th>
      <th>Preço</th>
      <th>Subtotal</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let produto of produtos; let i = index">
      <td>{{ produto.nome }}</td>
      <td>{{ produto.quantidade }}</td>
      <td>{{ produto.preco | currency:'BRL' }}</td>
      <td>{{ produto.quantidade * produto.preco | currency:'BRL' }}</td>
      <td>
        <button type="button" (click)="removerProduto(i)">Remover</button>
      </td>
    </tr>
  </tbody>
</table>

<p><strong>Valor total do estoque: {{ valorTotalEstoque | currency:'BRL' }}</strong></p>
